<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizRush</title> <style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2233;--mu:#68708a;--pr:#4f46e5;--prt:#fff;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#e1e4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141c;--card:#1c1f2b;--tx:#eceefa;--mu:#9aa1ba;--pr:#818cf8;--prt:#12141c;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1717;--bd:#2c3042}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141c;--card:#1c1f2b;--tx:#eceefa;--mu:#9aa1ba;--pr:#818cf8;--prt:#12141c;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1717;--bd:#2c3042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[v-cloak]{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
nav{max-width:860px;margin:auto;display:flex;align-items:center;gap:6px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;margin-right:auto}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--pr);color:var(--prt)}
main{max-width:860px;margin:auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0 .6em}h2{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mu{color:var(--mu);font-size:.92rem}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.dng{background:transparent;color:var(--no);border:1px solid var(--no)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input.bad{border-color:var(--no)}
.err{background:var(--nob);color:var(--no);border-radius:10px;padding:10px 14px;margin:10px 0}
.err ul{margin:4px 0 0;padding-left:20px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default;color:var(--tx)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--pr);transition:width 1s linear}.bar i.low{background:var(--no)}
.top{display:flex;justify-content:space-between;font-weight:700}
.big{font-size:3rem;font-weight:800;margin:.1em 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bd);font-size:.8rem;font-weight:700}
.qbox{border:1px dashed var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.ans{display:flex;gap:8px;align-items:center;margin:6px 0}.ans input[type=text]{flex:1}
@media (max-width:520px){main{padding:14px 12px 40px}.big{font-size:2.4rem}nav button{padding:8px}}
</style>
